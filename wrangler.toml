# Cloudflare Workers configuration (Worker + static assets, deployed with `wrangler deploy`).
# No build step: ./public is served as-is; src/worker.js handles /api/meta.
name = "papertools"
main = "src/worker.js"
compatibility_date = "2026-11-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
html_handling = "auto-trailing-slash"
not_found_handling = "none"

[observability]
enabled = true
